{% extends 'base.html' %}{% block t %}Voice{% endblock %}{% block c %}
<script src="{{ url_for('static', filename='diag.js') }}"></script>
<div class="phone" style="max-width:520px"><b style="color:var(--cy)">AI Diagnostic Assistant</b>
<div class="langs" role="group" aria-label="Language"><b id="l-en" class="on" onclick="setLang('en')">English</b><b id="l-ar" onclick="setLang('ar')">العربية</b></div>
<div class="orb" id="orb" role="button" tabindex="0" aria-label="Tap to answer by voice" onclick="listen()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();listen()}"><u></u><u></u><u></u><u></u><u></u><u></u><u></u><u></u><u></u></div>
<div class="big" id="st" aria-live="polite" style="font-size:1.15rem">Starting…</div>
<div class="chat" id="chat" aria-live="polite"></div>
<form class="vrow" onsubmit="event.preventDefault();send(document.getElementById('txt').value)"><input id="txt" autocomplete="off" placeholder="Type your answer here" aria-label="Your answer"><button class="btn" id="sendb">Send</button></form>
<div class="tg"><label><input type="checkbox" id="spk" checked> Read questions aloud</label><label><input type="checkbox" id="auto"> Auto-listen after each question</label></div>
<div id="res"></div>
<div id="after" style="display:none;margin-top:12px"><button class="btn ghost" id="savev" onclick="saveVitals()" style="display:none">Also save these readings to my Dashboard</button><button class="btn" style="margin-top:8px" onclick="restart()">New check</button></div>
</div>
<script>
const NAMES={{names|tojson}},Q={en:{{q1|tojson}},ar:{{q1ar|tojson}}},$=i=>document.getElementById(i);
let state=null,lang='en',busy=false,rec=null,lastReadings={};
const T={en:{tap:'Tap the orb and answer',lis:'Listening…',think:'Thinking…',nomic:'Microphone is blocked. Allow it in the browser address bar, or type your answer.',nonet:'Speech recognition needs an internet connection in this browser. Please type your answer.',nosr:'Voice input is not supported in this browser (use Chrome or Edge). You can type instead.',nospeech:'I did not hear anything. Tap the orb and try again.',secure:'Voice needs https:// or http://localhost – open the app at http://localhost:5000'},
 ar:{tap:'اضغط على الكرة وتحدث',lis:'أستمع…',think:'جارٍ التفكير…',nomic:'الميكروفون محظور. اسمح به من شريط العنوان أو اكتب إجابتك.',nonet:'التعرف على الصوت يحتاج اتصالاً بالإنترنت في هذا المتصفح. اكتب إجابتك من فضلك.',nosr:'الإدخال الصوتي غير مدعوم في هذا المتصفح (استخدم Chrome أو Edge). يمكنك الكتابة.',nospeech:'لم أسمع شيئاً. اضغط على الكرة وحاول مرة أخرى.',secure:'الصوت يحتاج https:// أو http://localhost'}};
function add(cls,t){const d=document.createElement('div');d.className='msg '+cls;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
function status(t){$('st').textContent=t}
function setLang(l){lang=l;$('l-en').classList.toggle('on',l=='en');$('l-ar').classList.toggle('on',l=='ar');$('chat').dir=l=='ar'?'rtl':'ltr';if(!$('chat').querySelector('.me'))restart();else status(T[lang].tap)}
function speak(t,then){
  if(!$('spk').checked||!window.speechSynthesis){then&&then();return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang=='ar'?'ar-EG':'en-US';u.onend=u.onerror=()=>then&&then();speechSynthesis.speak(u)}catch(e){then&&then()}}
function ask(t){add('bot',t);status(T[lang].tap);speak(t,()=>{if($('auto').checked&&state&&state.stage!=='done')listen()})}
function restart(){state={stage:'symptoms',symptoms:[],readings:{}};lastReadings={};$('chat').innerHTML='';$('res').innerHTML='';$('after').style.display='none';$('sendb').disabled=false;ask(Q[lang])}
async function send(text){
  text=(text||'').trim();if(!text||busy||state.stage==='done')return;busy=true;$('txt').value='';add('me',text);status(T[lang].think);
  try{const r=await api('/api/assistant',{state,text,lang});state=r.state;add('bot',r.message);
    if(r.finished){state.stage='done';status('✔');$('sendb').disabled=true;speak(r.message);$('res').innerHTML=renderCard(r.result);$('res').scrollIntoView({behavior:'smooth',block:'nearest'});
      const rd=Object.fromEntries(Object.entries(r.result.vitals).filter(([m,a])=>a.src==='reported'&&a.value!==null).map(([m,a])=>[m,a.value]));lastReadings=rd;
      $('savev').style.display=Object.keys(rd).length?'block':'none';$('after').style.display='block'}
    else{status(T[lang].tap);speak(r.message,()=>{if($('auto').checked)listen()})}
  }catch(e){status('⚠')}finally{busy=false}}
function listen(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return status(T[lang].nosr);
  if(!window.isSecureContext)return status(T[lang].secure);
  if(rec||busy||state.stage==='done')return;
  try{speechSynthesis.cancel()}catch(e){}
  const r=new R();rec=r;r.lang=lang=='ar'?'ar-EG':'en-US';r.interimResults=true;r.maxAlternatives=1;let final='',err='';
  r.onstart=()=>{$('orb').classList.add('live');status(T[lang].lis)};
  r.onresult=e=>{let t='';for(const x of e.results){t+=x[0].transcript;if(x.isFinal)final=t}$('txt').value=t};
  r.onerror=e=>{err=e.error;status(e.error==='not-allowed'||e.error==='service-not-allowed'?T[lang].nomic:e.error==='network'?T[lang].nonet:e.error==='no-speech'?T[lang].nospeech:'⚠ '+e.error)};
  r.onend=()=>{rec=null;$('orb').classList.remove('live');const t=(final||$('txt').value).trim();if(t&&!err)send(t);else if(!err)status(T[lang].nospeech)};
  try{r.start()}catch(e){rec=null;status('⚠')}}
async function saveVitals(){const readings=Object.entries(lastReadings).map(([metric_id,value])=>({metric_id,value}));
  try{await api('/api/log',{readings,note:'Voice assistant'});$('savev').style.display='none';add('sys','Readings saved to your Dashboard.')}catch(e){}}
restart();
if(!(window.SpeechRecognition||window.webkitSpeechRecognition))status(T.en.nosr);
</script>{% endblock %}
